[package]
name = "sekvent-db"
description = "Database pools, migrations, probes, leases and generic list filtering for sqlx and sea-orm."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# sqlx Postgres pools, classification and migrations.
sqlx-postgres = ["dep:sqlx", "sqlx/postgres"]
# sqlx MySQL pools, classification and migrations.
sqlx-mysql = ["dep:sqlx", "sqlx/mysql"]
# sea-orm error classification and list helpers (no backend by itself).
sea-orm = ["dep:sea-orm"]
# sea-orm over the registry's Postgres pools.
sea-orm-postgres = ["sea-orm", "sqlx-postgres", "sea-orm/sqlx-postgres"]
# sea-orm over the registry's MySQL pools.
sea-orm-mysql = ["sea-orm", "sqlx-mysql", "sea-orm/sqlx-mysql"]
# Migrations on boot (sqlx migrator; with `sea-orm-migrate`, sea-orm's).
migrate = []
# sea-orm `MigratorTrait` runner. Separate from `migrate` so sqlx-only users
# do not pull sea-orm-migration.
sea-orm-migrate = ["sea-orm", "migrate", "dep:sea-orm-migration"]
# `Deserialize`/`Serialize` for `ListParams` and `ColumnFilter`.
serde = ["dep:serde"]
# Leases with fencing tokens over a sqlx pool (`LeaseStore`); needs a sqlx backend.
lease = ["dep:tokio", "dep:tokio-util", "dep:uuid"]
# Readiness probes per pool (`PoolProbe`) and, with `lease`, the singleton
# job guard (`LeaseGuard`).
runtime = ["dep:sekvent-runtime", "dep:futures", "dep:tokio"]

[dependencies]
sekvent-config = { workspace = true }
sekvent-error = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sqlx = { workspace = true, optional = true }
sea-orm = { workspace = true, optional = true }
sea-orm-migration = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
# Path, not workspace: keeps sekvent-runtime's default grpc-web feature off.
sekvent-runtime = { path = "../sekvent-runtime", default-features = false, optional = true }

[dev-dependencies]
sekvent-testing = { workspace = true, features = ["postgres", "mysql"] }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
