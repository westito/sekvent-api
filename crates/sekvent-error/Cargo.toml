[package]
name = "sekvent-error"
description = "Transport-agnostic error model with lossless gRPC and HTTP mappings."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
serde = ["dep:serde", "dep:serde_json"]
http = ["serde", "dep:http", "dep:axum"]
grpc = ["dep:tonic", "dep:tonic-types", "dep:prost", "dep:prost-types", "dep:bytes"]

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
http = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
tonic-types = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
prost-types = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }

[dev-dependencies]
# Enables every mapping for this crate's own unit and integration tests.
sekvent-error = { path = ".", features = ["http", "grpc"] }
tokio = { workspace = true }
http-body-util = { workspace = true }

[lints]
workspace = true
