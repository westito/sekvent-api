[package]
name = "sekvent-facade-check"
description = "Compile guard: sekvent's macros used through the facade crate alone."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The only sekvent dependency is the facade, as in a consumer's manifest.
# A path dependency so `default-features = false` is honoured (see the
# facade's own manifest for the edition 2024 rule). `component-grpc` checks
# that the gRPC binding builds from the facade alone; `tenancy` that a scope
# factory and the tenant resolver do; `tenancy-lifecycle` and `tenancy-admin`
# that lifecycle hooks and a guarded admin method do.
[dependencies]
sekvent-api = { path = "../sekvent", default-features = false, features = ["config", "component", "component-grpc", "tenancy", "tenancy-lifecycle", "tenancy-admin"] }
# `#[derive(prost::Message)]` names `::prost`, so a crate with protobuf
# messages depends on prost itself.
prost = { workspace = true }
# A scope factory names `sqlx::PgPool` and a test builds a request head, as
# a product does: the facade re-exports neither crate.
http = { workspace = true }
sqlx = { workspace = true, features = ["postgres"] }

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
