[package]
name = "sekvent-macros"
description = "Procedural macros for sekvent."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
proc-macro = true

[dependencies]
syn = { workspace = true }
quote = { workspace = true }
proc-macro2 = { workspace = true }
proc-macro-crate = { workspace = true }
humantime = { workspace = true }

[dev-dependencies]
# A dev-dependency cycle (sekvent-component re-exports these macros), which
# Cargo allows: the trybuild cases need the runtime crate.
sekvent-component = { path = "../sekvent-component" }
# `MapSource` for the trybuild pass cases that choose a binding.
sekvent-config = { workspace = true }
trybuild = { workspace = true }
insta = { workspace = true }
prettyplease = { workspace = true }
prost = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
