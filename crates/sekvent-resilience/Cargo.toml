[package]
name = "sekvent-resilience"
description = "Timeouts, retries with budgets, rate gates, bulkheads, circuit breakers and a TTL cache."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# `ClientLimitLayer`: a `ClientLimiter` in front of axum routes.
http = ["dep:axum", "sekvent-error/http"]

[dependencies]
axum = { workspace = true, optional = true }
sekvent-error = { workspace = true }
sekvent-context = { workspace = true }
sekvent-config = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
humantime = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
sekvent-resilience = { path = ".", features = ["http"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tokio-util = { workspace = true }

[lints]
workspace = true
