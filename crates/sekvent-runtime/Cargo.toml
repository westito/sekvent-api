[package]
name = "sekvent-runtime"
description = "Service lifecycle, supervision, health, jobs and the combined gRPC/gRPC-Web/REST server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["grpc-web"]
# Serve gRPC-Web (browser clients) on the same listener as native gRPC.
grpc-web = ["dep:tonic-web"]
# Cron schedules for jobs (UTC).
cron = ["dep:croner", "dep:chrono"]
# Static files from a virtual filesystem and `StaticSite` to serve a built
# frontend; `Directory` reads a folder on disk.
vfs = ["dep:mime_guess", "dep:sha2", "dep:percent-encoding", "dep:httpdate"]
# `Embedded`: static files compiled into the binary with rust-embed.
vfs-embed = ["vfs", "dep:rust-embed"]

[dependencies]
sekvent-error = { workspace = true, features = ["http", "grpc"] }
sekvent-context = { workspace = true }
sekvent-config = { workspace = true }
sekvent-telemetry = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
tower = { workspace = true }
axum = { workspace = true }
http = { workspace = true }
hyper-util = { workspace = true, features = ["server-graceful", "service"] }
tonic = { workspace = true }
tonic-web = { workspace = true, optional = true }
tonic-health = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
rand = { workspace = true }
bytes = { workspace = true }
croner = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
mime_guess = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
percent-encoding = { workspace = true, optional = true }
httpdate = { workspace = true, optional = true }
rust-embed = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
prost = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
