[package]
name = "sekvent-runtime"
description = "Service lifecycle, supervision, health and the combined gRPC/gRPC-Web/REST server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["grpc-web"]
# Serve gRPC-Web (browser clients) on the same listener as native gRPC.
grpc-web = ["dep:tonic-web"]

[dependencies]
sekvent-error = { workspace = true, features = ["http", "grpc"] }
sekvent-context = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
tower = { workspace = true }
axum = { workspace = true }
http = { workspace = true }
hyper-util = { workspace = true, features = ["server-graceful", "service"] }
tonic = { workspace = true }
tonic-web = { workspace = true, optional = true }
tonic-health = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
bytes = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
prost = { workspace = true }

[lints]
workspace = true
