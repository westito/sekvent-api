[package]
name = "sekvent-api"
description = "The sekvent backend framework: facade over the sekvent-* crates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The package is `sekvent-api`; code still writes `use sekvent::…`.
[lib]
name = "sekvent"

[features]
default = ["config", "error", "context", "telemetry", "runtime"]

# One feature per library crate.
config = ["dep:sekvent-config"]
error = ["dep:sekvent-error"]
context = ["dep:sekvent-context"]
telemetry = ["dep:sekvent-telemetry"]
runtime = [
    "dep:sekvent-runtime",
    "sekvent-component?/runtime",
    "sekvent-db?/runtime",
    "sekvent-storage?/runtime",
]
resilience = ["dep:sekvent-resilience"]
auth = ["dep:sekvent-auth"]
link = ["dep:sekvent-link"]
client = ["dep:sekvent-client"]
db = ["dep:sekvent-db"]
# Components need the config source, the error model and the call context.
component = ["dep:sekvent-component", "config", "error", "context"]
# The component `grpc` binding and serving components over gRPC.
component-grpc = ["component", "sekvent-component/grpc"]
# Browser single sign-on (OAuth 2.0 code flow, Bitbucket Cloud provider).
sso = ["dep:sekvent-sso"]
# S3-compatible object storage: presigned uploads and downloads.
storage = ["dep:sekvent-storage"]

# sekvent-error wire mappings.
error-http = ["error", "sekvent-error/http"]
error-grpc = ["error", "sekvent-error/grpc"]

# sekvent-runtime: serve gRPC-Web next to native gRPC on the same listener.
runtime-grpc-web = ["runtime", "sekvent-runtime/grpc-web"]
# sekvent-runtime: cron schedules for jobs (UTC).
runtime-cron = ["runtime", "sekvent-runtime/cron"]
# sekvent-runtime: static files (`Vfs`, `Directory`) and `StaticSite` to serve
# a built frontend from the API's server.
runtime-vfs = ["runtime", "sekvent-runtime/vfs"]
# sekvent-runtime: `Embedded`, static files compiled in with rust-embed.
runtime-vfs-embed = ["runtime-vfs", "sekvent-runtime/vfs-embed"]

# sekvent-auth adapters.
auth-axum = ["auth", "sekvent-auth/axum"]
auth-tonic = ["auth", "sekvent-auth/tonic"]
# sekvent-auth: password hashing on tokio's blocking pool.
auth-tokio = ["auth", "sekvent-auth/tokio"]

# sekvent-link adapters.
link-axum = ["link", "sekvent-link/axum"]
link-tonic = ["link", "sekvent-link/tonic"]

# sekvent-db backends and migrations.
db-sqlx-postgres = ["db", "sekvent-db/sqlx-postgres"]
db-sqlx-mysql = ["db", "sekvent-db/sqlx-mysql"]
db-sea-orm-postgres = ["db", "sekvent-db/sea-orm-postgres"]
db-sea-orm-mysql = ["db", "sekvent-db/sea-orm-mysql"]
db-migrate = ["db", "sekvent-db/migrate"]
db-sea-orm-migrate = ["db", "sekvent-db/sea-orm-migrate"]
# sekvent-db: leases with fencing tokens; with `runtime`, singleton jobs.
db-lease = ["db", "sekvent-db/lease"]

full = [
    "config",
    "error",
    "context",
    "telemetry",
    "runtime",
    "resilience",
    "auth",
    "link",
    "client",
    "db",
    "component",
    "component-grpc",
    "sso",
    "storage",
    "error-http",
    "error-grpc",
    "runtime-grpc-web",
    "runtime-cron",
    "runtime-vfs",
    "runtime-vfs-embed",
    "auth-axum",
    "auth-tonic",
    "auth-tokio",
    "link-axum",
    "link-tonic",
    "db-sqlx-postgres",
    "db-sqlx-mysql",
    "db-sea-orm-postgres",
    "db-sea-orm-mysql",
    "db-migrate",
    "db-sea-orm-migrate",
    "db-lease",
]

[dependencies]
sekvent-config = { workspace = true, optional = true }
sekvent-error = { workspace = true, optional = true }
sekvent-context = { workspace = true, optional = true }
sekvent-telemetry = { workspace = true, optional = true }
# A path dependency rather than `workspace = true`: the workspace entry keeps
# sekvent-runtime's default features on, and edition 2024 refuses to turn them
# off from a member. This keeps `runtime-grpc-web` a real switch.
sekvent-runtime = { path = "../sekvent-runtime", default-features = false, optional = true }
sekvent-resilience = { workspace = true, optional = true }
sekvent-auth = { workspace = true, optional = true }
sekvent-link = { workspace = true, optional = true }
sekvent-client = { workspace = true, optional = true }
sekvent-db = { workspace = true, optional = true }
sekvent-component = { workspace = true, optional = true }
sekvent-sso = { workspace = true, optional = true }
sekvent-storage = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
