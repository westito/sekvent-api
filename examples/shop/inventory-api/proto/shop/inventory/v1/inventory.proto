syntax = "proto3";

// Contract of the inventory component: the service and every message it
// carries. The Rust trait `inventory_api::Inventory` is checked against the
// service at compile time, so the two cannot drift apart.
package shop.inventory.v1;

// Stock and reservations.
service Inventory {
  // Reserve stock for an order; reserving again for the same order returns
  // the existing reservation.
  rpc Reserve(ReserveRequest) returns (ReserveReply);
  // Release a reservation, giving its units back.
  rpc Release(ReleaseRequest) returns (ReleaseReply);
  // How many units of a SKU are available.
  rpc Stock(StockRequest) returns (StockReply);
}

// Reserve `quantity` units of `sku` for an order.
message ReserveRequest {
  string order_id = 1;
  string sku = 2;
  uint32 quantity = 3;
}

// A reservation and the stock left after it.
message ReserveReply {
  string reservation_id = 1;
  uint32 remaining = 2;
}

// Give a reservation's units back.
message ReleaseRequest {
  string reservation_id = 1;
}

// Whether the reservation was released.
message ReleaseReply {
  bool released = 1;
}

// Ask how many units of `sku` are available.
message StockRequest {
  string sku = 1;
}

// Units of `sku` available right now.
message StockReply {
  string sku = 1;
  uint32 available = 2;
}
