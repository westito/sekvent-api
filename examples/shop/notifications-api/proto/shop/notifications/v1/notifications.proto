syntax = "proto3";

// Contract of the notifications component, checked against the Rust trait
// `notifications_api::Notifications` at compile time.
package shop.notifications.v1;

// Customer notifications about orders.
service Notifications {
  // Notify a customer about an order.
  rpc Notify(NotifyRequest) returns (NotifyReply);
  // The notifications sent to a customer, oldest first.
  rpc Sent(SentRequest) returns (SentReply);
}

// Notify a customer about an order, using a named template.
message NotifyRequest {
  string customer_id = 1;
  string order_id = 2;
  string template = 3;
}

// The id of the stored notification.
message NotifyReply {
  string notification_id = 1;
}

// List the notifications sent to a customer.
message SentRequest {
  string customer_id = 1;
}

// The notifications sent to a customer, oldest first.
message SentReply {
  repeated Notification notifications = 1;
}

// One stored notification.
message Notification {
  string notification_id = 1;
  string customer_id = 2;
  string order_id = 3;
  string template = 4;
  // The tenant of the call that sent it, empty when the call had none.
  string tenant = 5;
}
