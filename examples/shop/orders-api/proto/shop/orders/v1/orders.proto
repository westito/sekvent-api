syntax = "proto3";

// Messages of the orders component. The component itself is declared in Rust
// (`orders_api::Orders`).
package shop.orders.v1;

// Place an order for `quantity` units of `sku`.
message PlaceOrderRequest {
  string customer_id = 1;
  string sku = 2;
  uint32 quantity = 3;
}

// The new order and the stock reservation backing it.
message PlaceOrderReply {
  string order_id = 1;
  string reservation_id = 2;
}

// Read one order.
message GetOrderRequest {
  string order_id = 1;
}

// A stored order.
message Order {
  string order_id = 1;
  string customer_id = 2;
  string sku = 3;
  uint32 quantity = 4;
  OrderStatus status = 5;
}

// Where an order is in its life.
enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_PLACED = 1;
}
