[package]
name = "shop"
description = "The example shop: inventory, notifications and orders as components, in one binary or split by configuration."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
inventory = { path = "../inventory" }
inventory-api = { path = "../inventory-api" }
notifications = { path = "../notifications" }
notifications-api = { path = "../notifications-api" }
orders = { path = "../orders" }
orders-api = { path = "../orders-api" }
sekvent-api = { path = "../../../crates/sekvent", default-features = false, features = ["component", "component-grpc", "config", "resilience", "runtime"] }
tokio = { workspace = true }

[dev-dependencies]
inventory-svc = { path = "../inventory-svc" }
rstest = { workspace = true }
sekvent-testing = { path = "../../../crates/sekvent-testing" }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
